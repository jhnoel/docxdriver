[package]
name = "docxdriver-monty-repl"
description = "The docxdriver Python API (Document, plan builders) as source for Monty sandbox hosts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["docx", "python", "monty", "sandbox", "llm"]
categories = ["text-processing"]
# Sandbox sources only; the generator manifest stays in the repository.
include = [
    "/src/**/*.rs",
    "/sandbox/*.py",
    "/sandbox/*.pyi",
    "/sandbox/*.md",
    "/README.md",
    "/LICENSE",
]

[dev-dependencies]
docxdriver-core = { path = "../docxdriver-core", version = "0.4.1" }
