[package]
name = "docxdriver-wasm"
description = "wasm-bindgen serialization adapter for docxdriver-core typed requests"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack's pinned wasm-opt predates the bulk-memory default in rustc's
# wasm32 target; without these flags it refuses the module outright.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
docxdriver-core = { path = "../docxdriver-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
