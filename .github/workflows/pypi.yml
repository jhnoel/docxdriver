name: Publish Python SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the workspace version
        shell: bash
        run: |
          version="$(awk '$0 == "[workspace.package]" { in_section = 1; next } /^\[/ { in_section = 0 } in_section && $1 == "version" { gsub(/\"/, "", $3); print $3; exit }' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match workspace version v$version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            sdist: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            sdist: false
          - os: macos-latest
            target: universal2-apple-darwin
            sdist: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sdist: false
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel${{ matrix.sdist && ' and source distribution' || '' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          maturin-version: v1.11.5
          working-directory: crates/docxdriver-python
          args: >-
            --profile python
            --locked
            --compatibility pypi
            --out dist
            ${{ matrix.sdist && '--sdist' || '' }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists-${{ matrix.target }}
          path: crates/docxdriver-python/dist
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docxdriver
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-dists-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
