[workspace]
resolver = "2"
members = ["crates/docxdriver-core", "crates/docxdriver-wasm", "crates/docxdriver-cli", "crates/docxdriver-mcp", "crates/docxdriver-python", "crates/docxdriver-monty-repl"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jhnoel/docxdriver"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# PyO3 converts unwinding Rust panics into Python exceptions instead of aborting the host.
[profile.python]
inherits = "release"
panic = "unwind"
