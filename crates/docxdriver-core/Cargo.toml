[package]
name = "docxdriver-core"
description = "Artifact-first DOCX engine: (bytes, DocxCommand JSON) -> (bytes, DocxCommandResult JSON)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xmloxide = { version = "0.4.3", default-features = false }
zip = { version = "5", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex-lite = "0.1.9"
latex2mathml = "0.2.3"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
schemars = "0.8"

[dev-dependencies]
