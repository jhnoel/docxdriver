[package]
name = "docxdriver-cli"
description = "Agent-oriented CLI for the docxdriver DOCX engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["docx", "ooxml", "word", "cli", "track-changes"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[[bin]]
name = "docxdriver"
path = "src/main.rs"

[dependencies]
docxdriver-core = { path = "../docxdriver-core", version = "0.3.3" }
clap = { version = "4", features = ["derive", "env"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
